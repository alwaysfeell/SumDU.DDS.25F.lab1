name: traveler

x-postgres: &postgres
  image: postgres:18-alpine
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_DB: postgres
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
  command:
    - "postgres"
    - "-c"
    - "listen_addresses=*"
    - "-c"
    - "password_encryption=scram-sha-256"
    - "-c"
    - "max_prepared_transactions=32"
    - "-c"
    - "wal_level=logical"
    - "-c"
    - "max_replication_slots=16"
    - "-c"
    - "max_wal_senders=16"
    - "-c"
    - "max_logical_replication_workers=8"
    - "-c"
    - "max_worker_processes=16"
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  shm_size: 256mb
  deploy:
    resources:
      limits:
        cpus: "${DB_CPUS:-2.0}"
        memory: ${DB_MEMORY:-1G}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  # PostgreSQL: 4 nodes x 4 shard databases
  postgres_00:
    <<: *postgres
    container_name: traveler_postgres_00
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_0 db_1 db_2 db_3"
    volumes:
      - pgdata_00:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  postgres_01:
    <<: *postgres
    container_name: traveler_postgres_01
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_4 db_5 db_6 db_7"
    volumes:
      - pgdata_01:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  postgres_02:
    <<: *postgres
    container_name: traveler_postgres_02
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_8 db_9 db_a db_b"
    volumes:
      - pgdata_02:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  postgres_03:
    <<: *postgres
    container_name: traveler_postgres_03
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_c db_d db_e db_f"
    volumes:
      - pgdata_03:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  # TravelerAPI
  web: &web
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.15}
    image: traveler-api:lab7
    container_name: traveler_web
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4567"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SHARD_MAPPING: /app/shards/mapping.json
      SHARD_REGISTRY: ${SHARD_REGISTRY:-}
      SHARD_POOL_MIN: ${SHARD_POOL_MIN:-1}
      SHARD_POOL_MAX: ${SHARD_POOL_MAX:-10}
    volumes:
      - ./shards:/app/shards:ro
    ports:
      - "127.0.0.1:${APP_PORT:-4567}:4567"
    depends_on:
      postgres_00:
        condition: service_healthy
      postgres_01:
        condition: service_healthy
      postgres_02:
        condition: service_healthy
      postgres_03:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4567/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-2.0}"
          memory: ${WEB_MEMORY:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web_2:
    <<: *web
    container_name: traveler_web_2
    profiles: ["scale"]
    ports:
      - "127.0.0.1:${APP_PORT_2:-4568}:4567"

  # shardctl: docker compose run --rm tools <command>
  tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    image: traveler-tools:lab6
    profiles: ["tools"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      SHARD_MAPPING: /work/shards/mapping.json
      SHARD_REGISTRY: ${SHARD_REGISTRY:-}
    volumes:
      - ./:/work
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.13.5}
    container_name: traveler_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - web
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.16}
    container_name: traveler_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/traveler-api.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata_00:
  pgdata_01:
  pgdata_02:
  pgdata_03:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge
