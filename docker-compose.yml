name: traveler

x-postgres: &postgres
  image: postgres:18-alpine
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    REPLICATION_USER: ${REPLICATION_USER:?Set REPLICATION_USER in .env}
    REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
  command:
    - "postgres"
    - "-c"
    - "listen_addresses=*"
    - "-c"
    - "wal_level=replica"
    - "-c"
    - "max_replication_slots=10"
    - "-c"
    - "max_wal_senders=10"
    - "-c"
    - "max_worker_processes=10"
    - "-c"
    - "hot_standby=on"
    - "-c"
    - "password_encryption=scram-sha-256"
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  shm_size: 256mb
  deploy:
    resources:
      limits:
        cpus: "${DB_CPUS:-2.0}"
        memory: ${DB_MEMORY:-1G}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  # PostgreSQL
  db:
    <<: *postgres
    container_name: traveler_db
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/replications/primary:/docker-entrypoint-replications:ro
      - ./db/replications/common:/docker-entrypoint-initdb.d:ro

  db_replica:
    <<: *postgres
    container_name: traveler_db_replica
    entrypoint: ["bash", "/docker-entrypoint-replications/entrypoint.sh"]
    environment:
      <<: *postgres-env
      REPLICA_NAME: replica1
    volumes:
      - pgdata_replica:/var/lib/postgresql
      - ./db/replications/standby:/docker-entrypoint-replications:ro
    ports:
      - "127.0.0.1:55432:5432"
    depends_on:
      db:
        condition: service_healthy

  # TravelerAPI
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.15}
    image: traveler-api:lab3
    container_name: traveler_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: "4567"
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    ports:
      - "127.0.0.1:${APP_PORT:-4567}:4567"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4567/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-2.0}"
          memory: ${WEB_MEMORY:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  pgdata_replica:

networks:
  backend:
    driver: bridge
