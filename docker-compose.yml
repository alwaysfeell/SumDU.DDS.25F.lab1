name: traveler

x-postgres: &postgres
  image: postgres:18-alpine
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_DB: postgres
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
  command:
    - "postgres"
    - "-c"
    - "listen_addresses=*"
    - "-c"
    - "password_encryption=scram-sha-256"
    - "-c"
    - "max_prepared_transactions=32"
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  shm_size: 256mb
  deploy:
    resources:
      limits:
        cpus: "${DB_CPUS:-2.0}"
        memory: ${DB_MEMORY:-1G}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  # PostgreSQL: 4 nodes x 4 shard databases
  postgres_00:
    <<: *postgres
    container_name: traveler_postgres_00
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_0 db_1 db_2 db_3"
    volumes:
      - pgdata_00:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  postgres_01:
    <<: *postgres
    container_name: traveler_postgres_01
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_4 db_5 db_6 db_7"
    volumes:
      - pgdata_01:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  postgres_02:
    <<: *postgres
    container_name: traveler_postgres_02
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_8 db_9 db_a db_b"
    volumes:
      - pgdata_02:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  postgres_03:
    <<: *postgres
    container_name: traveler_postgres_03
    environment:
      <<: *postgres-env
      SHARD_DATABASES: "db_c db_d db_e db_f"
    volumes:
      - pgdata_03:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/shards:/docker-entrypoint-initdb.d:ro

  # TravelerAPI
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.15}
    image: traveler-api:lab6
    container_name: traveler_web
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4567"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SHARD_MAPPING: /app/shards/mapping.json
      SHARD_POOL_MIN: ${SHARD_POOL_MIN:-1}
      SHARD_POOL_MAX: ${SHARD_POOL_MAX:-10}
    volumes:
      - ./shards:/app/shards:ro
    ports:
      - "127.0.0.1:${APP_PORT:-4567}:4567"
    depends_on:
      postgres_00:
        condition: service_healthy
      postgres_01:
        condition: service_healthy
      postgres_02:
        condition: service_healthy
      postgres_03:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4567/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-2.0}"
          memory: ${WEB_MEMORY:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # shardctl: docker compose run --rm tools <command>
  tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    image: traveler-tools:lab6
    profiles: ["tools"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_MAPPING: /work/shards/mapping.json
    volumes:
      - ./:/work
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata_00:
  pgdata_01:
  pgdata_02:
  pgdata_03:

networks:
  backend:
    driver: bridge
